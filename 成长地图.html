<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成功同心圆 · 成长地图</title>
<style>
/* ==========================================
   WDS Design System - Parent Dashboard Theme
   ========================================== */
:root {
  --parent-bg-dark: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  --parent-card-bg: rgba(255, 255, 255, 0.07);
  --parent-card-border: rgba(255, 255, 255, 0.12);
  --parent-text-primary: #ffffff;
  --parent-text-muted: #aab0c6;
  
  --parent-circle-core: #ff4757;
  --parent-circle-attitude: #ffa502;
  --parent-circle-behavior: #2ed573;
  
  --parent-state-glow: #ffd200;
  
  --font-sans: "PingFang SC", "Microsoft YaHei", sans-serif;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;
  
  --shadow-parent: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
  --backdrop-parent: blur(12px);
  --transition-base: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  background: var(--parent-bg-dark);
  color: var(--parent-text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
}

/* ==========================================
   02.1 PASSCODE ACCESS GATE (口令密码页)
   ========================================== */
.access-gate-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--parent-bg-dark);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  padding: 20px;
}

.gate-card {
  background: var(--parent-card-bg);
  backdrop-filter: var(--backdrop-parent);
  border: 1px solid var(--parent-card-border);
  box-shadow: var(--shadow-parent);
  border-radius: var(--radius-lg);
  padding: 40px 30px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  position: relative;
}

.gate-lock-icon {
  font-size: 3.5em;
  margin-bottom: 15px;
  animation: float 3s ease-in-out infinite;
  display: inline-block;
  transition: transform 0.2s;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.gate-card.error-shake {
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-10px); }
  40%, 80% { transform: translateX(10px); }
}

.gate-card h2 {
  font-size: 1.4em;
  color: var(--parent-state-glow);
  margin-bottom: 8px;
}

.gate-card p {
  font-size: 0.9em;
  color: var(--parent-text-muted);
  margin-bottom: 24px;
}

.gate-input-wrapper {
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--parent-card-border);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
}

.password-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  transition: background 0.2s;
}

.password-dot.filled {
  background: var(--parent-state-glow);
  box-shadow: 0 0 10px var(--parent-state-glow);
}

.keypad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.keypad-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-full);
  color: white;
  font-size: 1.25em;
  font-weight: bold;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}

.keypad-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: scale(1.05);
}

.keypad-btn:active {
  transform: scale(0.95);
}

.gate-error-message {
  color: #ff4757;
  font-size: 0.85em;
  min-height: 20px;
  margin-bottom: 16px;
  font-weight: bold;
}

.gate-footer-links {
  display: flex;
  justify-content: space-around;
  font-size: 0.85em;
}

.gate-footer-links a {
  color: var(--parent-text-muted);
  text-decoration: none;
  transition: color 0.2s;
}

.gate-footer-links a:hover {
  color: var(--parent-state-glow);
}

/* ==========================================
   02.2 MAIN REVIEW BOARD (家长主控制台)
   ========================================== */
.main-dashboard {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--parent-card-border);
  padding-bottom: 20px;
}

.dashboard-header h1 {
  font-size: 2.2em;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: bold;
}

.btn-secondary {
  background: var(--parent-card-bg);
  border: 1px solid var(--parent-card-border);
  color: white;
  padding: 8px 20px;
  border-radius: var(--radius-full);
  cursor: pointer;
  font-size: 0.9em;
  transition: var(--transition-base);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: var(--parent-state-glow);
}

/* 双栏排版 */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 30px;
}

/* 左侧栏 */
.left-visualization-panel {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.concentric-circle-card {
  background: var(--parent-card-bg);
  border: 1px solid var(--parent-card-border);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-shadow: var(--shadow-parent);
  position: relative;
}

/* Symmetrical SVG Stylings */
.svg-container {
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1;
}

.sector-group {
  cursor: pointer;
}

.sector-inner {
  fill: #ffa502;
  fill-opacity: 0.08;
  stroke: rgba(255, 255, 255, 0.1);
  stroke-width: 1px;
  transition: var(--transition-base);
}

.sector-outer {
  fill: #2ed573;
  fill-opacity: 0.06;
  stroke: rgba(255, 255, 255, 0.1);
  stroke-width: 1px;
  transition: var(--transition-base);
}

.sector-group text {
  fill: rgba(255, 255, 255, 0.8);
  font-size: 11px;
  font-weight: 600;
  transition: var(--transition-base);
  pointer-events: none;
}

/* Highlight styles */
.sector-group:hover .sector-inner,
.sector-group.active-glow .sector-inner {
  fill-opacity: 0.25;
  stroke: var(--parent-circle-attitude);
  stroke-width: 1.5px;
  filter: drop-shadow(0 0 5px rgba(255, 165, 2, 0.5));
}

.sector-group:hover .sector-outer,
.sector-group.active-glow .sector-outer {
  fill-opacity: 0.22;
  stroke: var(--parent-circle-behavior);
  stroke-width: 1.5px;
  filter: drop-shadow(0 0 5px rgba(46, 213, 115, 0.5));
}

.sector-group:hover text,
.sector-group.active-glow text {
  fill: #ffffff;
  font-size: 12px;
}

.circle-core-bg {
  fill: var(--parent-circle-core);
  fill-opacity: 0.1;
  stroke: var(--parent-circle-core);
  stroke-width: 1.5px;
  transition: var(--transition-base);
}

.circle-core-inner {
  fill: var(--parent-circle-core);
  filter: drop-shadow(0 0 8px var(--parent-circle-core));
}

/* 图表区 */
.charts-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.chart-card {
  background: var(--parent-card-bg);
  border: 1px solid var(--parent-card-border);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-parent);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.chart-card h3 {
  font-size: 1em;
  color: var(--parent-text-muted);
  margin-bottom: 15px;
  text-align: center;
}

.chart-canvas {
  width: 100%;
  max-width: 230px;
  aspect-ratio: 1;
}

/* 右侧栏卡片 */
.right-detail-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: 800px;
  overflow-y: auto;
  padding-right: 8px;
}

.right-detail-panel::-webkit-scrollbar {
  width: 6px;
}

.right-detail-panel::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.1);
  border-radius: var(--radius-full);
}

.sector-detail-card {
  background: var(--parent-card-bg);
  border: 1px solid var(--parent-card-border);
  border-radius: var(--radius-md);
  padding: 20px;
  transition: var(--transition-base);
}

.sector-detail-card.highlight {
  background: rgba(255,255,255,0.15);
  border-color: var(--parent-state-glow);
  box-shadow: 0 4px 15px rgba(255, 210, 0, 0.15);
  transform: translateX(-4px);
}

.sector-detail-card h3 {
  font-size: 1.1em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sector-detail-card .mapping-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  font-size: 0.75em;
  font-weight: bold;
}

.tag.attitude { background: rgba(255,165,2,0.2); color: #ffa502; }
.tag.behavior { background: rgba(46,213,115,0.2); color: #2ed573; }

.sector-detail-card p {
  font-size: 0.85em;
  color: var(--parent-text-muted);
  line-height: 1.6;
}

/* 底部操作与亲子话题 */
.dashboard-footer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  gap: 20px;
}

.data-utility-group {
  display: flex;
  gap: 12px;
}

/* 亲子沟通锦囊抽屉 */
.drawer-tips-trigger {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #0f0c29;
  font-weight: bold;
  border: none;
  padding: 12px 24px;
  border-radius: var(--radius-full);
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 210, 0, 0.3);
  transition: var(--transition-base);
}

.drawer-tips-trigger:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 210, 0, 0.5);
}

.tips-drawer-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(5px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

.tips-drawer-modal.open {
  display: flex;
}

.tips-card {
  background: #1e1b4b;
  border: 1px solid var(--parent-card-border);
  border-radius: var(--radius-lg);
  padding: 30px;
  max-width: 500px;
  width: 90%;
  box-shadow: var(--shadow-parent);
  position: relative;
  animation: modalSlideUp 0.4s ease forwards;
}

.tips-card h2 {
  font-size: 1.3em;
  color: var(--parent-state-glow);
  margin-bottom: 15px;
  border-bottom: 1px dashed var(--parent-card-border);
  padding-bottom: 8px;
}

.tips-card p {
  font-size: 0.95em;
  line-height: 1.8;
  color: #fff;
  margin-bottom: 24px;
}

/* 响应式适配 */
@media (max-width: 900px) {
  .dashboard-grid {
    grid-template-columns: 1fr;
  }
  .charts-wrapper {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

  <!-- ==============================
       02.1 ACCESS GATE (口令验证层)
       ============================== -->
  <div class="access-gate-overlay" id="gate-overlay">
    <div class="gate-card" id="gate-card">
      <div class="gate-lock-icon" id="gate-lock">🔒</div>
      <h2>魔法导师口令验证</h2>
      <p>请输入三位魔法指令，隔离儿童记录以保障数据安全</p>
      
      <!-- 密码点显示 -->
      <div class="gate-input-wrapper">
        <div class="password-dot" id="dot-1"></div>
        <div class="password-dot" id="dot-2"></div>
        <div class="password-dot" id="dot-3"></div>
      </div>

      <!-- 软键盘 -->
      <div class="keypad-grid">
        <button class="keypad-btn" onclick="pressKey(1)">1</button>
        <button class="keypad-btn" onclick="pressKey(2)">2</button>
        <button class="keypad-btn" onclick="pressKey(3)">3</button>
        <button class="keypad-btn" onclick="pressKey(4)">4</button>
        <button class="keypad-btn" onclick="pressKey(5)">5</button>
        <button class="keypad-btn" onclick="pressKey(6)">6</button>
        <button class="keypad-btn" onclick="pressKey(7)">7</button>
        <button class="keypad-btn" onclick="pressKey(8)">8</button>
        <button class="keypad-btn" onclick="pressKey(9)">9</button>
        <button class="keypad-btn" onclick="clearKeys()" style="font-size:0.9em;background:rgba(255,71,87,0.15)">清除</button>
        <button class="keypad-btn" onclick="pressKey(0)">0</button>
        <button class="keypad-btn" onclick="submitAuth()" style="font-size:0.9em;background:rgba(46,213,115,0.15);color:#2ed573">进入</button>
      </div>

      <div class="gate-error-message" id="gate-error"></div>

      <div class="gate-footer-links">
        <a href="小人书.html">➔ 返回小人书</a>
      </div>
    </div>
  </div>

  <!-- ==============================
       02.2 MAIN REVIEW DASHBOARD (复盘控制台)
       ============================== -->
  <div class="container" id="dashboard-container" style="display:none;">
    <div class="main-dashboard">
      
      <!-- 头部 -->
      <div class="dashboard-header">
        <div>
          <h1>成功同心圆 · 家长复盘控制台</h1>
          <p style="color:var(--parent-text-muted); font-size:0.9em; margin-top:4px;">与孩子开展周末亲子反思，阅读定量数据，点亮性格宝石</p>
        </div>
        <button class="btn-secondary" onclick="exitAuth()">退出导师视角</button>
      </div>

      <!-- 主视图双栏 -->
      <div class="dashboard-grid">
        
        <!-- 左侧栏：SVG同心圆与Canvas图表 -->
        <div class="left-visualization-panel">
          
          <!-- 同心圆卡片 -->
          <div class="concentric-circle-card">
            <h2 style="font-size:1.1em; margin-bottom:15px; color:var(--parent-state-glow);">成功同心圆对称图</h2>
            <div class="svg-container">
              <svg viewBox="0 0 750 750" id="symmetrical-svg" width="100%" height="100%">
                <!-- 动态生成SVG扇区 -->
              </svg>
            </div>
          </div>

          <!-- 统计图表区 -->
          <div class="charts-wrapper">
            <!-- 雷达图 -->
            <div class="chart-card">
              <h3>六维态度打卡雷达图</h3>
              <canvas id="radar-canvas" class="chart-canvas"></canvas>
            </div>
            <!-- 心情柱图 -->
            <div class="chart-card">
              <h3>本周心情晴雨表</h3>
              <canvas id="mood-canvas" class="chart-canvas"></canvas>
            </div>
          </div>

        </div>

        <!-- 右侧栏：文字映射详情卡片 -->
        <div class="right-detail-panel" id="detail-panel">
          <!-- 动态加载扇区联动卡片 -->
        </div>

      </div>

      <!-- 底部控制按钮与伴读抽屉 -->
      <div class="dashboard-footer-actions">
        <div class="data-utility-group">
          <button class="btn-secondary" onclick="exportData()">🏺 导出备份</button>
          <button class="btn-secondary" onclick="resetData()" style="color:#ff4757;">🗑️ 重置清空</button>
        </div>
        <button class="drawer-tips-trigger" onclick="openTipsDrawer()">💡 亲子沟通对话锦囊 ➔</button>
      </div>

    </div>
  </div>

  <!-- 伴读小抽屉弹窗 -->
  <div class="tips-drawer-modal" id="tips-modal">
    <div class="tips-card">
      <div class="quiz-modal-close" onclick="closeTipsDrawer()">✕</div>
      <h2>💡 亲子复盘对话锦囊</h2>
      <p id="weakest-tips-text">本周孩子没有记录任何打卡，鼓励孩子多参与自省吧！</p>
      <button class="btn-secondary" onclick="closeTipsDrawer()" style="width:100%; padding:12px;">收到</button>
    </div>
  </div>

<script>
/* ==========================================
   02.1 Passcode Lock Logic (密码门逻辑)
   ========================================== */
let inputPasscode = "";

// 检查是否已经授权
if (sessionStorage.getItem("growmap_parent_auth") === "true") {
  unlockDashboard();
}

function pressKey(num) {
  if (inputPasscode.length >= 3) return;
  inputPasscode += num;
  updatePasswordDots();
}

function clearKeys() {
  inputPasscode = "";
  updatePasswordDots();
  document.getElementById('gate-error').innerText = "";
}

function updatePasswordDots() {
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById(`dot-${i}`);
    dot.classList.toggle('filled', i <= inputPasscode.length);
  }
}

function submitAuth() {
  const gateCard = document.getElementById('gate-card');
  const gateLock = document.getElementById('gate-lock');
  const gateError = document.getElementById('gate-error');
  
  if (inputPasscode === "123") {
    // 成功
    gateLock.innerText = "🔓";
    sessionStorage.setItem("growmap_parent_auth", "true");
    setTimeout(() => {
      unlockDashboard();
    }, 400);
  } else {
    // 失败
    gateCard.classList.add('error-shake');
    gateError.innerText = "口令不对哦，请查看小人书底页！";
    inputPasscode = "";
    updatePasswordDots();
    setTimeout(() => {
      gateCard.classList.remove('error-shake');
    }, 400);
  }
}

function unlockDashboard() {
  document.getElementById('gate-overlay').style.display = 'none';
  document.getElementById('dashboard-container').style.display = 'block';
  // 初始化渲染
  initDashboard();
}

function exitAuth() {
  sessionStorage.removeItem("growmap_parent_auth");
  location.reload();
}

/* ==========================================
   02.2 Dashboard Core Logic (主面板渲染、对称SVG及联动)
   ========================================== */
// 扇区定义（态度-行为一一映射，共 6 组，完美 MECE 不重不漏）
const sectorsData = [
  { id: 1, attitude: "🚀 积极主动", behavior: "📚 努力学习", key: "proactive", desc: "遇到困难时不抱怨外部天气或条件，主动寻求改变（怎么想），并集中精力付诸于刻苦攻读和积累本领（怎么做）。" },
  { id: 2, attitude: "🦁 充满自信", behavior: "🎯 发现兴趣", key: "confidence", desc: "相信自己有独特的天分与潜能（怎么想），在广阔的未知中勇于探索并找到最能点亮双眼的热爱之处（怎么做）。" },
  { id: 3, attitude: "🪞 每日自省", behavior: "⚡ 有效执行", key: "reflection", desc: "每天如照镜子般审视自己并承认不足（怎么想），随后将改变计划拆解为目标并立即马不停蹄地执行到底（怎么做）。" },
  { id: 4, attitude: "🛡️ 勇往直前", behavior: "⭐ 追寻理想", key: "courage", desc: "在害怕中依然保持直面困难的勇气（怎么想），在灯塔的指引下坚定不移地朝梦想方向迈进（怎么做）。" },
  { id: 5, attitude: "🌍 宽广胸怀", behavior: "🤝 合作沟通", key: "mindset", desc: "包容他人与不同意见，主动接受不可改变的规则（怎么想），并在团队中精诚协作、资源互补（怎么做）。" },
  { id: 6, attitude: "💛 拥有同理", behavior: "💬 人际交流", key: "empathy", desc: "设身处地站在他人的鞋子里去感受痛苦（怎么想），并在交流中耐心倾听、诚恳清晰地表达关怀（怎么做）。" }
];

function initDashboard() {
  renderSymmetricalSVG();
  renderDetailCards();
  setupHoverBindings();
  
  // 渲染 Canvas 图表
  const history = JSON.parse(localStorage.getItem('growmap_checkin_history') || '[]');
  renderRadarChart(history);
  renderMoodChart(history);
}

// 1. 动态绘制完美对称的 SVG 同心圆
function renderSymmetricalSVG() {
  const svg = document.getElementById('symmetrical-svg');
  const cx = 375, cy = 375;
  const rCore = 95;      // 价值观半径
  const rMid = 205;      // 态度半径
  const rOut = 315;      // 行为半径
  
  let svgContent = `
    <!-- 定义滤镜与渐变 -->
    <defs>
      <radialGradient id="coreGrad" cx="50%" cy="50%">
        <stop offset="0%" stop-color="#ff7675"/><stop offset="100%" stop-color="#ff4757"/>
      </radialGradient>
    </defs>
    
    <!-- 三层辅助圆边线 -->
    <circle cx="${cx}" cy="${cy}" r="${rOut}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="${rMid}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="${rCore}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  `;
  
  // 6个扇区，从 -90° (12点方向) 开始，顺时针方向递增 60°
  sectorsData.forEach((sec, i) => {
    const startAngle = i * 60 - 90;
    const endAngle = (i + 1) * 60 - 90;
    const midAngle = startAngle + 30;
    const midRad = (midAngle * Math.PI) / 180;
    
    // 生成中环态度扇区与外环行为扇区路径
    const pathAtt = getSectorPath(cx, cy, rCore, rMid, startAngle, endAngle);
    const pathBeh = getSectorPath(cx, cy, rMid, rOut, startAngle, endAngle);
    
    // 计算文字居中坐标
    const rTextAtt = (rCore + rMid) / 2;
    const rTextBeh = (rMid + rOut) / 2;
    
    const txAtt = cx + rTextAtt * Math.cos(midRad);
    const tyAtt = cy + rTextAtt * Math.sin(midRad);
    const txBeh = cx + rTextBeh * Math.cos(midRad);
    const tyBeh = cy + rTextBeh * Math.sin(midRad);
    
    svgContent += `
      <g class="sector-group" data-sector="${sec.id}">
        <!-- 态度层 -->
        <path class="sector-inner" d="${pathAtt}" />
        <!-- 行为层 -->
        <path class="sector-outer" d="${pathBeh}" />
        
        <!-- 态度文字，为了在倾斜角度更好的显示，微调垂直偏移 -->
        <text x="${txAtt}" y="${tyAtt + 4}" text-anchor="middle" dominant-baseline="middle">${sec.attitude.split(' ')[1]}</text>
        <!-- 行为文字 -->
        <text x="${txBeh}" y="${tyBeh + 4}" text-anchor="middle" dominant-baseline="middle">${sec.behavior.split(' ')[1]}</text>
      </g>
    `;
  });
  
  // 绘制圆心价值观
  svgContent += `
    <!-- 圆心：诚信价值观 -->
    <circle cx="${cx}" cy="${cy}" r="${rCore}" class="circle-core-bg" />
    <circle cx="${cx}" cy="${cy}" r="${rCore - 40}" class="circle-core-inner" />
    <text x="${cx}" y="${cy - 8}" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" pointer-events="none">价值观</text>
    <text x="${cx}" y="${cy + 12}" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" pointer-events="none">诚 信</text>
  `;
  
  svg.innerHTML = svgContent;
}

// 极坐标转换直角坐标并输出扇区圆弧路径定义
function getSectorPath(x, y, rIn, rOut, startAngle, endAngle) {
  const startRad = (startAngle * Math.PI) / 180;
  const endRad = (endAngle * Math.PI) / 180;
  const xOutStart = x + rOut * Math.cos(startRad);
  const yOutStart = y + rOut * Math.sin(startRad);
  const xOutEnd = x + rOut * Math.cos(endRad);
  const yOutEnd = y + rOut * Math.sin(endRad);
  const xInStart = x + rIn * Math.cos(startRad);
  const yInStart = y + rIn * Math.sin(startRad);
  const xInEnd = x + rIn * Math.cos(endRad);
  const yInEnd = y + rIn * Math.sin(endRad);
  
  return `M ${xInStart} ${yInStart} L ${xOutStart} ${yOutStart} A ${rOut} ${rOut} 0 0 1 ${xOutEnd} ${yOutEnd} L ${xInEnd} ${yInEnd} A ${rIn} ${rIn} 0 0 0 ${xInStart} ${yInStart} Z`;
}

// 2. 渲染右侧详情卡片
function renderDetailCards() {

// 3. 绑定 Hover 双向高亮联动
function setupHoverBindings() {
  // SVG hover ➔ 卡片
  document.querySelectorAll('.sector-group').forEach(group => {
    const secId = group.getAttribute('data-sector');
    
    group.addEventListener('mouseenter', () => {
      document.querySelectorAll(`.sector-detail-card[data-sector="${secId}"]`).forEach(card => {
        card.classList.add('highlight');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
    
    group.addEventListener('mouseleave', () => {
      document.querySelectorAll(`.sector-detail-card[data-sector="${secId}"]`).forEach(card => {
        card.classList.remove('highlight');
      });
    });
  });
  
  // 卡片 hover ➔ SVG
  document.querySelectorAll('.sector-detail-card').forEach(card => {
    const secId = card.getAttribute('data-sector');
    
    card.addEventListener('mouseenter', () => {
      const svgGroup = document.querySelector(`.sector-group[data-sector="${secId}"]`);
      if (svgGroup) svgGroup.classList.add('active-glow');
    });
    
    card.addEventListener('mouseleave', () => {
      const svgGroup = document.querySelector(`.sector-group[data-sector="${secId}"]`);
      if (svgGroup) svgGroup.classList.remove('active-glow');
    });
  });
}

// 4. 纯 Canvas 离线绘制雷达图
function renderRadarChart(history) {
  const canvas = document.getElementById('radar-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // 强制设置分辨率防模糊
  canvas.width = 300;
  canvas.height = 300;
  
  const cx = 150, cy = 150;
  const rMax = 110;
  const labels = ["积极", "自信", "自省", "勇气", "胸怀", "同理"];
  
  // 计算雷达数据值（态度勾选词频统计）
  const data = [0, 0, 0, 0, 0, 0]; // 对应 labels 顺序
  history.forEach(item => {
    if (item.achieves) {
      item.achieves.forEach(act => {
        if (act.includes("积极主动")) data[0]++;
        if (act.includes("充满自信")) data[1]++;
        if (act.includes("每日自省") || act.includes("自省")) data[2]++;
        if (act.includes("勇往直前") || act.includes("勇气")) data[3]++;
        if (act.includes("宽广胸怀") || act.includes("胸怀")) data[4]++;
        if (act.includes("拥有同理") || act.includes("同理心")) data[5]++;
      });
    }
  });
  
  // 确定分度比例，雷达图最低尺度为 5 次打卡
  const maxVal = Math.max(5, ...data);
  
  // 清画布
  ctx.clearRect(0, 0, 300, 300);
  
  // (a) 绘制 5 层背景同心正六边形
  ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
  ctx.lineWidth = 1;
  for (let j = 1; j <= 5; j++) {
    const r = (rMax / 5) * j;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = (i * 60 - 90) * Math.PI / 180;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  
  // (b) 绘制 6 条放射轴线
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (i * 60 - 90) * Math.PI / 180;
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + rMax * Math.cos(angle), cy + rMax * Math.sin(angle));
  }
  ctx.stroke();
  
  // (c) 绘制态度实际多边形数据
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const ratio = data[i] / maxVal;
    const angle = (i * 60 - 90) * Math.PI / 180;
    const x = cx + rMax * ratio * Math.cos(angle);
    const y = cy + rMax * ratio * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = "rgba(255, 165, 2, 0.4)";
  ctx.fill();
  ctx.strokeStyle = "#ffa502";
  ctx.lineWidth = 2.5;
  ctx.stroke();
  
  // (d) 绘制文字标签
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.font = "bold 12px var(--font-sans)";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let i = 0; i < 6; i++) {
    const angle = (i * 60 - 90) * Math.PI / 180;
    // 文字偏置一点防和多边形折角重合
    const x = cx + (rMax + 18) * Math.cos(angle);
    const y = cy + (rMax + 10) * Math.sin(angle);
    ctx.fillText(labels[i], x, y);
  }
}

// 5. 纯 Canvas 离线绘制柱状图 (心情心情分布统计)
function renderMoodChart(history) {
  const canvas = document.getElementById('mood-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  canvas.width = 300;
  canvas.height = 300;
  
  const width = 300, height = 300;
  const paddingLeft = 40, paddingRight = 20, paddingTop = 30, paddingBottom = 40;
  const graphWidth = width - paddingLeft - paddingRight;
  const graphHeight = height - paddingTop - paddingBottom;
  
  // 统计心情频度
  const moodCounts = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
  history.forEach(item => {
    if (item.mood) moodCounts[item.mood]++;
  });
  
  const moodData = [moodCounts[5], moodCounts[4], moodCounts[3], moodCounts[2], moodCounts[1]];
  const maxCount = Math.max(3, ...moodData); // 最小纵轴分度为 3 次
  
  ctx.clearRect(0, 0, 300, 300);
  
  // 绘制底座 X 轴和 Y 轴
  ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(paddingLeft, paddingTop);
  ctx.lineTo(paddingLeft, height - paddingBottom);
  ctx.lineTo(width - paddingRight, height - paddingBottom);
  ctx.stroke();
  
  // 纵轴刻度线 (分为4格)
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
  ctx.font = "10px sans-serif";
  for (let i = 0; i <= 4; i++) {
    const val = Math.round((maxCount / 4) * i);
    const y = (height - paddingBottom) - (graphHeight / 4) * i;
    ctx.fillText(val, paddingLeft - 8, y);
    
    // 辅助虚线
    ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
    ctx.beginPath();
    ctx.moveTo(paddingLeft, y);
    ctx.lineTo(width - paddingRight, y);
    ctx.stroke();
  }
  
  // 绘制 5 根表情柱条
  const emojis = ["😆", "🙂", "😐", "🙁", "😡"];
  const barWidth = 24;
  const gap = (graphWidth - (barWidth * 5)) / 6;
  
  ctx.textAlign = "center";
  for (let i = 0; i < 5; i++) {
    const x = paddingLeft + gap + (barWidth + gap) * i;
    const barHeight = (moodData[i] / maxCount) * graphHeight;
    const y = (height - paddingBottom) - barHeight;
    
    // 渐变柱子
    const grad = ctx.createLinearGradient(x, y, x, height - paddingBottom);
    grad.addColorStop(0, "#2ed573");
    grad.addColorStop(1, "rgba(46, 213, 115, 0.15)");
    
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, barWidth, barHeight);
    ctx.strokeStyle = "#2ed573";
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, barWidth, barHeight);
    
    // 绘制横轴表情标签
    ctx.font = "16px sans-serif";
    ctx.fillText(emojis[i], x + barWidth/2, height - paddingBottom + 16);
    // 柱顶显示数值
    if (moodData[i] > 0) {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 10px sans-serif";
      ctx.fillText(moodData[i], x + barWidth/2, y - 8);
    }
  }
}

/* ==========================================

function openTipsDrawer() {

  const tipsText = document.getElementById('weakest-tips-text');
  
  // 1. 统计态度出现最少的一项
  const data = { "🚀 积极主动": 0, "🦁 充满自信": 0, "🪞 每日自省": 0, "🛡️ 勇往直前": 0, "🌍 宽广胸怀": 0, "💛 拥有同理": 0 };
  
  history.forEach(item => {
    if (item.achieves) {
      item.achieves.forEach(act => {
        if (act.includes("积极主动")) data["🚀 积极主动"]++;
        if (act.includes("充满自信")) data["🦁 充满自信"]++;
        if (act.includes("每日自省") || act.includes("自省")) data["🪞 每日自省"]++;
        if (act.includes("勇往直前") || act.includes("勇气")) data["🛡️ 勇往直前"]++;
        if (act.includes("宽广胸怀") || act.includes("胸怀")) data["🌍 宽广胸怀"]++;
        if (act.includes("拥有同理") || act.includes("同理心")) data["💛 拥有同理"]++;
      });
    }
  });
  
  // 找到词频最小的态度项
  let weakestAttitude = "";
  let minCount = 9999;
  
  for (let key in data) {
    if (data[key] < minCount) {
      minCount = data[key];
      weakestAttitude = key;
    }
  }
  
  // 智能定制伴读对话提示词
  if (history.length === 0) {
    tipsText.innerHTML = `🔮 <strong>亲子反思卡：</strong><br><br>小睿这周还没有留下成长打卡记录哦。今天放学回家后，爸爸可以和女儿一起翻开《小人书.html》的第一章，鼓励小睿把第一次自省打卡作为探险挑战吧！`;
  } else {
    let advice = "";
    if (weakestAttitude.includes("积极主动")) {
      advice = "这周小睿关于【积极主动】的打卡偏少。爸爸可以说：‘小睿，这周下雨的时候，你有没有像嘟嘟狗一样穿上积极跑鞋在屋里画画呢？我们可以多想想那些自己能做决定的事情噢。’";
    } else if (weakestAttitude.includes("充满自信")) {
      advice = "这周小睿在【自信】上的反馈稍弱。您可以鼓励她：‘宝贝，这周你在写数学题或练习兴趣特长时，有没有哪个时刻像童话里的小狮子一样感到很自豪呢？勇敢秀给爸爸看看！’";
    } else if (weakestAttitude.includes("每日自省")) {
      advice = "这周关于【自省】打卡稍显薄弱。爸爸可以引导：‘小睿，每天睡觉前咱们照照心里的小镜子，找出一个今天做得很棒的地方和一个明天可以更好的地方，好不好？’";
    } else if (weakestAttitude.includes("勇往直前")) {
      advice = "这周小睿的【勇气】打卡偏少。爸爸可以开展对话：‘宝贝，你这周有遇到什么自己感到有一点点害怕，但还是勇敢去尝试的事情吗？哪怕是第一个举手或者承认错误，都非常了不起！’";
    } else if (weakestAttitude.includes("宽广胸怀")) {
      advice = "这周小睿关于【宽广胸怀】的积累有待提高。您可以说：‘女儿，如果别的小朋友在课间不小心弄乱了你的彩笔，你是像风筝飞走了一样懊恼，还是用宽广的胸怀和对方微笑着说没关系呢？’";
    } else {
      advice = "这周关于【同理心】的沟通小卡：‘小睿，你今天在学校里有没有注意观察别的小朋友，如果他难过了，我们能不能设身处地地站在他的鞋子里，给他递一张纸巾呢？’";
    }
    
    tipsText.innerHTML = `🔮 <strong>亲子复盘对话锦囊（基于孩子打卡弱项定制）：</strong><br><br>${advice}`;

}

// 导出备份为 JSON 文件
function exportData() {
  const history = localStorage.getItem('growmap_checkin_history') || '[]';
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(history);
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", `growmap_checkin_backup_${new Date().toISOString().split('T')[0]}.json`);
  dlAnchorElem.click();
}

// 数据清空重置
function resetData() {
  const check = confirm("⚠️ 警告：这将会抹除所有小睿本地已积累的成长宝石和解锁勋章记录，且此操作不可逆！\n\n您确定要彻底清空吗？");
  if (check) {
    localStorage.removeItem('growmap_checkin_history');
    localStorage.removeItem('growmap_streak_count');
    localStorage.removeItem('growmap_unlocked_badges');
    localStorage.removeItem('growmap_last_checkin_date');
    localStorage.removeItem('growmap_quiz_perfect_pass');
    alert("数据已重置清空。");
    location.reload();
  }
}
